server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/clipforge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

outbox.batch-size=${OUTBOX_BATCH_SIZE:10}
outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:1000}
outbox.stale-leasetimeout-seconds=${OUTBOX_STALE_LEASE_TIMEOUT_SECONDS:300}
outbox.max-startup-retries=${OUTBOX_MAX_STARTUP_RETRIES:10}
outbox.exchange=${OUTBOX_EXCHANGE:clipforge.events}
outbox.publisher-confirm-timeout-ms=${OUTBOX_PUBLISHER_CONFIRM_TIMEOUT_MS:5000}

management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
